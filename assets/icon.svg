<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- mola-harness: a loop mark — two arcs forming a cycle around a core dot.
       Dark slate tile, amber loop. Distinct from the leaf (green), envelope
       (indigo), and other repo marks. -->
  <rect width="128" height="128" rx="28" fill="#1e293b"/>
  <g fill="none" stroke="#f59e0b" stroke-width="9" stroke-linecap="round">
    <path d="M64 28 A36 36 0 0 1 100 64"/>
    <path d="M64 100 A36 36 0 0 1 28 64"/>
  </g>
  <circle cx="64" cy="64" r="11" fill="#fbbf24"/>
</svg>
